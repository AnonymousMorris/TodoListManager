[package]
name = "todolist-manager"
version = "0.1.0"
edition = "2021"
description = "A minimalistic terminal UI todolist manager that let's you create and organize multiple todolists with controls based on vim motions"
license = "MIT"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
home = "0.5.12"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.2"

